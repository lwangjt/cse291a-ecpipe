# One placement = which server each stage talks to. Copy per placement; change base_url only.
name: P1-vision-gpu_planner-cpu
planner_feeds_grounding: false      # false: grounding uses the gold instruction (isolates cost from planner quality)
workload: {ctx_tokens: 2000}
stages:
  planner:   {base_url: "http://127.0.0.1:8002/v1", model: planner, max_tokens: 48}
  grounding: {base_url: "http://127.0.0.1:8001/v1", model: vlm, prompt: structured,
              coord_space: norm1000, max_pixels: 1048576, max_tokens: 64}
server_pids: []
